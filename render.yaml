services:
  - type: web
    name: kartini-exam-portal
    runtime: node
    plan: free
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://messtelevisi-glitch.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: kartini-exam-db
          property: connectionString

databases:
  - name: kartini-exam-db
    plan: free
